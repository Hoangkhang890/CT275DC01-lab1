<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3: Các biểu mẫu đăng nhập</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome Icons CDN (hoặc dùng <link rel="stylesheet" href="css/all.min.css"> từ thư mục ex3) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">

</head>
<body class="py-5">

  <div class="container">
    <div class="form-card">
      <div class="form-card-body">
        <form>
          <div class="row mb-3 align-items-center">
            <label for="hEmail" class="col-sm-3 col-form-label text-sm-end fw-bold">Email:</label>
            <div class="col-sm-8">
              <input type="email" class="form-control" id="hEmail" placeholder="Nhập vào email">
            </div>
          </div>
          <div class="row mb-3 align-items-center">
            <label for="hPassword" class="col-sm-3 col-form-label text-sm-end fw-bold">Mật khẩu:</label>
            <div class="col-sm-8">
              <input type="password" class="form-control" id="hPassword" placeholder="Nhập vào mật khẩu">
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-sm-8 offset-sm-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="hRemember">
                <label class="form-check-label" for="hRemember">
                  Ghi nhớ tôi
                </label>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-sm-8 offset-sm-3">
              <button type="submit" class="btn btn-primary px-4">Đăng nhập</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="form-card">
      <div class="form-card-body">
        <form>
          <div class="mb-3">
            <label for="vEmail" class="form-label fw-bold">Email:</label>
            <input type="email" class="form-control" id="vEmail" placeholder="Nhập vào email">
          </div>
          <div class="mb-3">
            <label for="vPassword" class="form-label fw-bold">Password:</label>
            <input type="password" class="form-control" id="vPassword" placeholder="Nhập vào mật khẩu">
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="vRemember">
            <label class="form-check-label" for="vRemember">Ghi nhớ tôi</label>
          </div>
          <button type="submit" class="btn btn-primary px-4">Đăng nhập</button>
        </form>
      </div>
    </div>

    <div class="form-card form-card-inline">
      <div class="form-card-body">
        <form class="row row-cols-lg-auto g-3 align-items-center justify-content-center">
          <div class="col-12">
            <div class="input-group">
              <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-user"></i></span>
              <input type="email" class="form-control" placeholder="Nhập vào email">
            </div>
          </div>

          <div class="col-12">
            <div class="input-group">
              <span class="input-group-text bg-light text-secondary"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">
            </div>
          </div>

          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="inlineRemember">
              <label class="form-check-label" for="inlineRemember">
                Ghi nhớ tôi
              </label>
            </div>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary px-3">Đăng nhập</button>
          </div>
        </form>
      </div>
    </div>

    <div class="form-card p-4 text-center border-danger">
      <h2 class="mb-3">Mở biểu mẫu đăng nhập</h2>
      <button type="button" class="btn btn-info text-white px-4 py-2" data-bs-toggle="modal" data-bs-target="#loginModal">
        Mở hộp thoại
      </button>
    </div>

    <!-- Modal Bootstrap Popup -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border: 1px solid #dc3545;">
          
          <div class="modal-header modal-header-custom border-0 pt-4 pb-2">
            <h4 class="modal-title modal-title-custom">
              <i class="fa-solid fa-lock me-2"></i>Đăng nhập
            </h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body px-4 py-3">
            <form>
              <div class="mb-3">
                <label for="mUser" class="form-label fw-bold">
                  <i class="fa-solid fa-user me-1"></i>Người dùng:
                </label>
                <input type="text" class="form-control" id="mUser" placeholder="Nhập tên người dùng">
              </div>

              <div class="mb-3">
                <label for="mPass" class="form-label fw-bold">
                  <i class="fa-solid fa-eye me-1"></i>Mật khẩu:
                </label>
                <input type="password" class="form-control" id="mPass" placeholder="Nhập mật khẩu">
              </div>

              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="mRemember">
                <label class="form-check-label" for="mRemember">Ghi nhớ tôi</label>
              </div>

              <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                <i class="fa-solid fa-power-off me-1"></i> Đăng nhập
              </button>
            </form>
          </div>

          <div class="modal-footer justify-content-between border-0 px-4 pb-4 pt-2">
            <button type="button" class="btn btn-danger px-3" data-bs-dismiss="modal">
              <i class="fa-solid fa-xmark me-1"></i> Hủy bỏ
            </button>
            <div class="text-end small">
              <div>Bạn chưa phải là thành viên? <a href="#" class="text-decoration-none">Đăng ký</a></div>
              <div><a href="#" class="text-decoration-none">Quên mật khẩu?</a></div>
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
